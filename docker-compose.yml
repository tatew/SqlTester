name: sqltester

services:
  mysql:
    image: ${SQLT_IMAGE:-mysql:8.0}
    environment:
      MYSQL_ROOT_PASSWORD: practice
    ports:
      - "${SQLT_PORT:-3307}:3306"
    # Data is rebuilt from the problem files on every run, so keep it in memory (fast, nothing to clean up).
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # TCP ping only succeeds once the real server is up (the init-time server has networking disabled).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppractice", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 5s
